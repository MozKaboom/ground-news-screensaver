<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ground News Top Stories</title>
<style>
  :root {
    --left: #3d6fd6;
    --center: #d9d9d9;
    --right: #d64545;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --faint: rgba(255, 255, 255, 0.18);
    --unit: min(1vw, 1.6vh);
  }
  @media (orientation: portrait) {
    :root { --unit: min(1.4vw, 1.1vh); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #07090d; color: var(--text);
    font-family: Rubik, "Roboto", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .slide {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity 1.4s ease;
  }
  .slide.shown { opacity: 1; }
  .photo {
    position: absolute; inset: -4%;
    background-size: cover; background-position: center;
    transform: scale(1.02);
  }
  .slide.shown .photo { animation: drift var(--duration, 15s) ease-out forwards; }
  @keyframes drift {
    from { transform: scale(1.02) translate(0, 0); }
    to { transform: scale(1.12) translate(-1.5%, -1%); }
  }
  .nophoto {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 80% 15%, rgba(61, 111, 214, 0.35), transparent 55%),
      radial-gradient(circle at 15% 90%, rgba(214, 69, 69, 0.25), transparent 50%),
      #0b0e14;
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(4, 6, 10, 0.96) 0%, rgba(4, 6, 10, 0.82) 32%, rgba(4, 6, 10, 0.25) 62%, rgba(4, 6, 10, 0.55) 100%);
  }
  @media (orientation: landscape) {
    .scrim {
      background:
        linear-gradient(to right, rgba(4, 6, 10, 0.94) 0%, rgba(4, 6, 10, 0.78) 42%, rgba(4, 6, 10, 0.1) 75%),
        linear-gradient(to top, rgba(4, 6, 10, 0.7) 0%, transparent 45%),
        linear-gradient(to bottom, rgba(4, 6, 10, 0.55) 0%, transparent 20%);
    }
  }
  .content {
    position: absolute;
    left: calc(var(--unit) * 5); right: calc(var(--unit) * 5);
    bottom: calc(var(--unit) * 7);
    display: flex; flex-direction: column; gap: calc(var(--unit) * 1.8);
  }
  @media (orientation: landscape) {
    .content { right: auto; width: min(62vw, 1100px); bottom: calc(var(--unit) * 6); }
  }
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--unit) * 1.2);
    font-size: calc(var(--unit) * 1.7); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
  }
  .meta .topic { color: var(--text); }
  .meta span + span::before { content: "•"; margin-right: calc(var(--unit) * 1.2); opacity: 0.6; }
  h1 {
    font-size: calc(var(--unit) * 5.2); line-height: 1.12; font-weight: 700;
    letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    text-wrap: balance;
  }
  .summary {
    font-size: calc(var(--unit) * 2.3); line-height: 1.45; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bias { display: flex; flex-direction: column; gap: calc(var(--unit) * 0.8); margin-top: calc(var(--unit) * 0.6); }
  .bar {
    display: flex; height: calc(var(--unit) * 1.1); min-height: 6px;
    border-radius: 999px; overflow: hidden; background: var(--faint);
    width: min(100%, calc(var(--unit) * 60));
  }
  .bar i { display: block; height: 100%; }
  .bar .l { background: var(--left); }
  .bar .c { background: var(--center); }
  .bar .r { background: var(--right); }
  .legend {
    display: flex; flex-wrap: wrap; gap: calc(var(--unit) * 2.2);
    font-size: calc(var(--unit) * 1.7); color: var(--muted);
  }
  .legend b { font-weight: 600; color: var(--text); }
  .legend .dot {
    display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%;
    margin-right: 0.45em; vertical-align: 0.02em;
  }
  .top {
    position: absolute; top: calc(var(--unit) * 4); left: calc(var(--unit) * 5); right: calc(var(--unit) * 5);
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 2; pointer-events: none;
  }
  .brand {
    display: flex; align-items: center; gap: calc(var(--unit) * 1.2);
    font-size: calc(var(--unit) * 1.8); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .brand .mark {
    width: calc(var(--unit) * 2.6); height: calc(var(--unit) * 2.6); border-radius: 50%;
    background: conic-gradient(var(--left) 0 33%, var(--center) 0 66%, var(--right) 0);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35);
  }
  .brand small { font-weight: 400; color: var(--muted); letter-spacing: 0.06em; text-transform: none; }
  .clock { text-align: right; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
  .clock .time { font-size: calc(var(--unit) * 5); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .clock .date { font-size: calc(var(--unit) * 1.7); color: var(--muted); margin-top: calc(var(--unit) * 0.6); }
  .progress {
    position: absolute; left: calc(var(--unit) * 5); right: calc(var(--unit) * 5); bottom: calc(var(--unit) * 3);
    display: flex; gap: calc(var(--unit) * 0.8); z-index: 2;
  }
  .progress div { flex: 1; height: 3px; border-radius: 3px; background: var(--faint); overflow: hidden; }
  .progress div i { display: block; height: 100%; width: 0; background: rgba(255, 255, 255, 0.85); }
  .progress div.done i { width: 100%; }
  .progress div.now i { animation: fill var(--duration, 15s) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .notice {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: calc(var(--unit) * 2);
    font-size: calc(var(--unit) * 2.6); color: var(--muted); text-align: center; padding: 10%;
  }
  .notice .mark {
    width: calc(var(--unit) * 7); height: calc(var(--unit) * 7); border-radius: 50%;
    background: conic-gradient(var(--left) 0 33%, var(--center) 0 66%, var(--right) 0);
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stale { color: #ffb4a8; }
</style>
</head>
<body>
<div id="slides"></div>
<div class="top">
  <div class="brand"><span class="mark"></span><span>Top Stories <small id="source">from ground.news</small></span></div>
  <div class="clock" id="clock" hidden><div class="time" id="time"></div><div class="date" id="date"></div></div>
</div>
<div class="progress" id="progress"></div>
<script id="gn-data" type="application/json">__GN_DATA__</script>
<script>
(function () {
  'use strict';
  var data;
  try { data = JSON.parse(document.getElementById('gn-data').textContent); } catch (e) { data = null; }
  if (!data || typeof data !== 'object') data = { stories: [], options: {}, updated: 0, error: null };
  var options = data.options || {};
  var stories = data.stories || [];
  var seconds = Math.max(5, Number(options.secondsPerStory) || 15);
  document.documentElement.style.setProperty('--duration', seconds + 's');

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function ago(iso) {
    var t = Date.parse(iso);
    if (!t) return null;
    var minutes = Math.round((Date.now() - t) / 60000);
    if (minutes < 1) return 'Just now';
    if (minutes < 60) return minutes + ' min ago';
    var hours = Math.round(minutes / 60);
    if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
    var days = Math.round(hours / 24);
    return days + (days === 1 ? ' day ago' : ' days ago');
  }

  // The clock follows the kiosk's own locale and 12 or 24 hour preference.
  if (options.showClock !== false) {
    var clock = document.getElementById('clock');
    clock.hidden = false;
    var tick = function () {
      var now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    };
    tick();
    setInterval(tick, 1000 * 15);
  }

  var root = document.getElementById('slides');
  if (!stories.length) {
    var notice = el('div', 'notice');
    notice.appendChild(el('div', 'mark'));
    notice.appendChild(el('div', data.error ? 'stale' : null, data.error ? data.error + '. Trying again soon.' : 'Loading top stories…'));
    root.appendChild(notice);
    return;
  }
  if (data.error) {
    document.getElementById('source').textContent = 'from ground.news · offline, last update ' +
      new Date(data.updated).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('source').className = 'stale';
  }

  function biasBlock(story) {
    if (options.showBias === false || story.left == null) return null;
    var left = story.left || 0, center = story.center || 0, right = story.right || 0;
    var total = left + center + right;
    if (!total) return null;
    var block = el('div', 'bias');
    var bar = el('div', 'bar');
    [['l', left], ['c', center], ['r', right]].forEach(function (part) {
      if (!part[1]) return;
      var seg = el('i', part[0]);
      seg.style.width = (part[1] * 100 / total) + '%';
      bar.appendChild(seg);
    });
    block.appendChild(bar);
    var legend = el('div', 'legend');
    [['Left', left, 'var(--left)'], ['Center', center, 'var(--center)'], ['Right', right, 'var(--right)']].forEach(function (part) {
      var item = el('span');
      var dot = el('span', 'dot');
      dot.style.background = part[2];
      item.appendChild(dot);
      item.appendChild(document.createTextNode(part[0] + ' '));
      item.appendChild(el('b', null, Math.round(part[1]) + '%'));
      legend.appendChild(item);
    });
    block.appendChild(legend);
    return block;
  }

  var slides = stories.map(function (story) {
    var slide = el('div', 'slide');
    if (story.image) {
      var photo = el('div', 'photo');
      photo.style.backgroundImage = 'url("' + story.image + '")';
      slide.appendChild(photo);
    } else {
      slide.appendChild(el('div', 'nophoto'));
    }
    slide.appendChild(el('div', 'scrim'));
    var content = el('div', 'content');
    var meta = el('div', 'meta');
    if (story.topic) meta.appendChild(el('span', 'topic', story.topic));
    if (story.place) meta.appendChild(el('span', null, story.place));
    var when = ago(story.start);
    if (when) meta.appendChild(el('span', 'when', when));
    if (story.sources) meta.appendChild(el('span', null, story.sources + (story.sources === 1 ? ' source' : ' sources')));
    content.appendChild(meta);
    content.appendChild(el('h1', null, story.title));
    if (options.showSummary !== false && story.summary) content.appendChild(el('p', 'summary', story.summary));
    var bias = biasBlock(story);
    if (bias) content.appendChild(bias);
    slide.appendChild(content);
    root.appendChild(slide);
    slide._story = story;
    return slide;
  });

  var progress = document.getElementById('progress');
  var bars = stories.length > 1 ? stories.map(function () {
    var bar = el('div');
    bar.appendChild(el('i'));
    progress.appendChild(bar);
    return bar;
  }) : [];

  var index = -1;
  function show(next) {
    if (index >= 0) slides[index].classList.remove('shown');
    index = next;
    var slide = slides[index];
    var when = slide.querySelector('.when');
    if (when) when.textContent = ago(slide._story.start) || '';
    // Restart the drift and the progress animations.
    var photo = slide.querySelector('.photo');
    if (photo) { photo.style.animation = 'none'; void photo.offsetWidth; photo.style.animation = ''; }
    slide.classList.add('shown');
    bars.forEach(function (bar, i) {
      bar.className = i < index ? 'done' : '';
      var fill = bar.firstChild;
      fill.style.animation = 'none'; void fill.offsetWidth; fill.style.animation = '';
      if (i === index) bar.className = 'now';
    });
  }
  show(0);
  if (slides.length > 1) setInterval(function () { show((index + 1) % slides.length); }, seconds * 1000);
})();
</script>
</body>
</html>
